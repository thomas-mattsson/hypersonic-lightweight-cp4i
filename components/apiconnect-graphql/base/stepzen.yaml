apiVersion: stepzen-graph.ibm.com/v1beta1
kind: StepZenGraphServer
metadata:
  name: stepzen
spec:
  license:
    accept: true
  controlDatabaseSecret: stepzen-db-secret
  imagePullSecrets: 
    - ibm-entitlement-key
  graphServer:
    hpa:
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
  graphServerSubscription:
    hpa:
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
