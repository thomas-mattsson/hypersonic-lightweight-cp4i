kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: stepzen-admin-cmd-job-role
rules:
  - apiGroups:
      - stepzen-graph.ibm.com
      - route.openshift.io
      - networking.k8s.io
      - ''
    resources:
      - '*'
    verbs:
      - list
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - list
      - get